{% extends "base.html" %}{% block title %}Registro e inicio de sesión | CinePedia{% endblock %}{% block content %}
<div class="row g-4 justify-content-center">
    <div class="col-lg-6">
        <section class="card p-4 h-100">
            <h1 class="h3 mb-3">Registro</h1>
            <form method="post" action="{{ url_for('usuarios.registro') }}">
                <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="nombre"
                        minlength="2" required></div>
                <div class="mb-3"><label class="form-label">Apellido</label><input class="form-control" name="apellido"
                        minlength="2" required></div>
                <div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email"
                        name="email" required></div>
                <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control"
                        type="password" name="password" minlength="8" required></div>
                <div class="mb-3"><label class="form-label">Confirmar contraseña</label><input class="form-control"
                        type="password" name="confirmar" minlength="8" required></div><button
                    class="btn btn-primary">Registrar</button>
            </form>
        </section>
    </div>
    <div class="col-lg-5">
        <section class="card p-4 h-100">
            <h2 class="h3 mb-3">Inicio de sesión</h2>
            <form method="post" action="{{ url_for('usuarios.login') }}">
                <div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email"
                        name="login_email" required></div>
                <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control"
                        type="password" name="login_password" required></div><button class="btn btn-primary">Iniciar
                    sesión</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Registro e inicio de sesión | CinePedia{% endblock %}

{% block content %}

<div class="row g-4 justify-content-center">

    <div class="col-lg-6">
        <section class="card p-4 h-100">
            <h1 class="h3 mb-3">Registro</h1>

            <form method="post" action="{{ url_for('usuarios.registro') }}">

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre"
                           name="nombre" minlength="2" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="apellido">Apellido</label>
                    <input class="form-control" id="apellido"
                           name="apellido" minlength="2" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control" id="email"
                           type="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-control" id="password"
                           type="password" name="password"
                           minlength="8" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmar">
                        Confirmar contraseña
                    </label>
                    <input class="form-control" id="confirmar"
                           type="password" name="confirmar"
                           minlength="8" required>
                </div>

                <button class="btn btn-primary" type="submit">
                    Registrar
                </button>
            </form>
        </section>
    </div>

    <div class="col-lg-5">
        <section class="card p-4 h-100">
            <h2 class="h3 mb-3">Inicio de sesión</h2>

            <form method="post" action="{{ url_for('usuarios.login') }}">

                <div class="mb-3">
                    <label class="form-label" for="login_email">
                        E-mail
                    </label>
                    <input class="form-control" id="login_email"
                           type="email" name="login_email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="login_password">
                        Contraseña
                    </label>
                    <input class="form-control" id="login_password"
                           type="password" name="login_password" required>
                </div>

                <button class="btn btn-primary" type="submit">
                    Iniciar sesión
                </button>
            </form>
        </section>
    </div>

</div>

{% endblock %}

<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CinePedia{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark cine-navbar mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold"
        href="{{ url_for('peliculas.listar') if session.get('usuario_id') else url_for('usuarios.inicio') }}">CinePedia</a>
      {% if session.get('usuario_id') %}<div class="d-flex align-items-center gap-3"><span>Hola, {{
          session.get('usuario_nombre', 'usuario') }}</span><a class="btn btn-sm btn-outline-light"
          href="{{ url_for('peliculas.listar') }}">Inicio</a>
        <form method="post" action="{{ url_for('usuarios.logout') }}"><button class="btn btn-sm btn-light"
            type="submit">Cerrar sesión</button></form>
      </div>{% endif %}
    </div>
  </nav>
  <main class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div
      class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }} alert-dismissible fade show"
      role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"
        aria-label="Cerrar"></button></div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

{% extends "base.html" %}

{% block title %}Editar película | CinePedia{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <section class="card p-4">

            <h1 class="h2 mb-4">Editar película</h1>

            <form method="post"
                  action="{{ url_for('peliculas.editar', pelicula_id=pelicula.id) }}">

                <div class="mb-3">
                    <label for="nombre_pelicula" class="form-label">
                        Nombre de película
                    </label>
                    <input class="form-control" id="nombre_pelicula"
                           name="nombre_pelicula" minlength="3"
                           maxlength="100"
                           value="{{ datos.get('nombre_pelicula', '') }}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="director" class="form-label">Director</label>
                    <input class="form-control" id="director"
                           name="director" minlength="2" maxlength="100"
                           value="{{ datos.get('director', '') }}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="fecha_estreno" class="form-label">
                        Fecha de estreno
                    </label>
                    <input class="form-control" id="fecha_estreno"
                           type="date" name="fecha_estreno"
                           value="{{ datos.get('fecha_estreno', '') }}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="sinopsis" class="form-label">Sinopsis</label>
                    <textarea class="form-control" id="sinopsis"
                              name="sinopsis" rows="5"
                              maxlength="5000" required>{{ datos.get('sinopsis', '') }}</textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                    Guardar cambios
                </button>

                <a class="btn btn-outline-secondary"
                   href="{{ url_for('peliculas.detalle', pelicula_id=pelicula.id) }}">
                    Cancelar
                </a>

            </form>
        </section>
    </div>
</div>

{% endblock %}
